name: Build Windows executable

# Windows .exe builds must happen on a Windows runner — PyInstaller does
# not cross-compile from macOS/Linux. windows-latest is a standard free
# GitHub-hosted runner; no paid GitHub feature is used anywhere here.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller YouTubeTranscriber.spec --noconfirm

      - name: Verify expected executable exists
        shell: bash
        run: |
          test -f "dist/YouTubeTranscriber/YouTubeTranscriber.exe" || {
            echo "::error::YouTubeTranscriber.exe was not produced by the build"
            exit 1
          }
          test -f "dist/YouTubeTranscriber/YouTubeTranscriber-Debug.exe" || {
            echo "::error::YouTubeTranscriber-Debug.exe was not produced by the build"
            exit 1
          }
          test -f "dist/YouTubeTranscriber/Run YouTubeTranscriber.bat" || {
            echo "::error::Run YouTubeTranscriber.bat was not produced by the build"
            exit 1
          }

      - name: Package distributable ZIP
        shell: pwsh
        run: |
          @"
          YouTubeTranscriber - Windows

          IMPORTANT: extract this whole ZIP first (right-click -> Extract All).
          Do not run files straight from the ZIP preview window.

          Double-click "Run YouTubeTranscriber.bat" to start. Your browser
          opens automatically at http://127.0.0.1:8501 once the app is ready.

          Local Whisper (only needed for videos with no YouTube captions):
          run scripts\setup_whisper.ps1 from a source checkout.

          Windows may show a SmartScreen warning because this executable is
          not code-signed (no commercial certificate was purchased, to
          keep this project's distribution cost at `$0). See README.md.
          "@ | Out-File -Encoding utf8 "dist/YouTubeTranscriber/README.txt"

          Compress-Archive -Path "dist/YouTubeTranscriber" -DestinationPath "dist/YouTubeTranscriber-Windows-x64.zip"

      - name: Verify ZIP artifact exists
        shell: bash
        run: test -f "dist/YouTubeTranscriber-Windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeTranscriber-Windows-x64
          path: dist/YouTubeTranscriber-Windows-x64.zip
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YouTubeTranscriber-Windows-x64
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/YouTubeTranscriber-Windows-x64.zip
          generate_release_notes: true
